[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jianying-factory"
version = "8.1.0"
description = "剪映工厂 - 剪映的超级操作员：确定性内核 + 官方能力直调 + 生产流程编排"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "websockets>=12.0",    # SAMI TTS 官方音色
    "edge-tts>=6.1.0",     # 配音兜底
    "requests>=2.31.0",
    "flask>=3.0.0",        # VectCutAPI 服务端
    "imageio>=2.31.0",
    "psutil>=5.9.0",
    "oss2>=2.18.0",
    "json5>=0.9.14",
    "Pillow>=10.0.0",      # 封面/头像/字幕样式
]
# 注：pyJianYingDraft 由 VectCutAPI 内核内置精简版提供（install.py 自动获取），
#     不放入 dependencies 以免 pip 安装版本不明；仅 advanced/hotspot_mix 深度功能需要

[tool.setuptools.packages.find]
include = ["jyfactory*"]

[tool.setuptools.package-data]
jyfactory = ["data/*.csv", "*.json", "*.md"]
